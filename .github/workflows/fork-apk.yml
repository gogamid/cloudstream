name: Fork APK

on:
  push:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'gogamid/cloudstream'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle with persistent feature-branch cache
        uses: gradle/actions/setup-gradle@v5
        with:
          # setup-gradle otherwise makes non-default branches read-only.
          cache-read-only: false
          cache-cleanup: on-success
      - name: Test app and library regressions, lint, and build debug APKs
        run: |
          chmod +x gradlew
          ./gradlew --build-cache --parallel --max-workers=2 --console=plain --profile \
            :app:testPrereleaseDebugUnitTest :library:jvmTest :shared:compileKotlinJvm \
            :app:lintPrereleaseDebug :app:assemblePrereleaseDebug \
            :app:assemblePrereleaseDebugAndroidTest
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cloudstream-discover-apk
          path: app/build/outputs/apk/prerelease/debug/*.apk
          compression-level: 0
      - name: Upload emulator test APK
        uses: actions/upload-artifact@v7
        with:
          name: cloudstream-input-test-apk
          path: app/build/outputs/apk/androidTest/prerelease/debug/*.apk
          if-no-files-found: error
          compression-level: 0
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-test-reports
          path: |
            app/build/reports/tests/testPrereleaseDebugUnitTest/
            app/build/test-results/testPrereleaseDebugUnitTest/
            app/build/reports/lint-results-prereleaseDebug.*
            library/build/reports/tests/jvmTest/
            library/build/test-results/jvmTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug/checks Gradle profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-profile-debug
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 14

  # Run release compilation in parallel, rather than delaying emulator validation
  # behind a second app variant. A run is valid only when ALL three jobs pass.
  signed-stable:
    if: github.repository == 'gogamid/cloudstream'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORK_STABLE_KEYSTORE_PATH: ${{ github.workspace }}/.signing/fork-stable.p12
      FORK_STABLE_STORE_PASSWORD: ${{ secrets.FORK_STABLE_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Restore permanent stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_STABLE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$FORK_STABLE_STORE_PASSWORD"
          umask 077
          mkdir -p "$(dirname "$FORK_STABLE_KEYSTORE_PATH")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FORK_STABLE_KEYSTORE_PATH"
          keytool -list -keystore "$FORK_STABLE_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass:env FORK_STABLE_STORE_PASSWORD -alias fork-stable
      - name: Set up Gradle with persistent feature-branch cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: on-success
      - name: Build permanently signed stable APK
        run: |
          chmod +x gradlew
          ./gradlew --build-cache --parallel --max-workers=2 --console=plain --profile \
            :app:assembleStableRelease
      - name: Verify stable signing certificate
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/stable/release/*.apk | tee "$RUNNER_TEMP/stable-cert.txt"
          grep -qi 'b4a192d86f664d1288e1023964fedadb2fd34ff5239696e8bcd3e16f8acdf69f' "$RUNNER_TEMP/stable-cert.txt"
      - name: Upload stable APK (most performant, alongside beta)
        uses: actions/upload-artifact@v7
        with:
          name: cloudstream-stable-apk
          path: app/build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload stable Gradle profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-profile-stable
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 14

  compose-input-smoke:
    if: github.repository == 'gogamid/cloudstream'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cloudstream-discover-apk
          path: emulator-app
      - uses: actions/download-artifact@v8
        with:
          name: cloudstream-input-test-apk
          path: emulator-tests
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test TV input, Apply and remote settings on Android 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -no-snapshot-save
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb install -r emulator-app/*.apk
            adb install -r emulator-tests/*.apk
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            # The previous docs-only run was blocked by a Nexus Launcher ANR
            # stealing every test's input. The fixture never uses the launcher.
            adb shell am force-stop com.google.android.apps.nexuslauncher
            adb logcat -c
            adb shell pm list instrumentation | tee compose-input-instrumentation.txt
            adb shell am instrument -w -r -e class com.lagradost.cloudstream3.ForkComposeInputTest,com.lagradost.cloudstream3.ForkComposePreferenceRetryTest,com.lagradost.cloudstream3.ForkRemoteButtonsTest,com.lagradost.cloudstream3.ForkSeekBurstTest,com.lagradost.cloudstream3.ForkSourceCollectionTest,com.lagradost.cloudstream3.ForkSourceWaitSettingsTest "$(adb shell pm list instrumentation | tr -d '\r' | awk '/^instrumentation:com.lagradost.cloudstream3/ { sub(/^instrumentation:/, "", $1); print $1; exit }')" | tee compose-input-results.txt
            adb logcat -d > compose-input-logcat.txt
            adb shell dumpsys window windows > compose-input-windows.txt
            grep -q 'OK (22 tests)' compose-input-results.txt
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-input-smoke-reports
          path: compose-input-*.txt
          if-no-files-found: ignore
          retention-days: 14
