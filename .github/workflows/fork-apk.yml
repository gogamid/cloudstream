name: Fork APK

on:
  push:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'gogamid/cloudstream'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORK_STABLE_KEYSTORE_PATH: ${{ runner.temp }}/fork-stable.p12
      FORK_STABLE_STORE_PASSWORD: ${{ secrets.FORK_STABLE_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Restore permanent stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_STABLE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$FORK_STABLE_STORE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$FORK_STABLE_KEYSTORE_PATH"
          keytool -list -keystore "$FORK_STABLE_KEYSTORE_PATH" -storetype PKCS12 \
            -storepass:env FORK_STABLE_STORE_PASSWORD -alias fork-stable
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Test filmography and discovery, lint, and build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testPrereleaseDebugUnitTest \
            --tests 'com.lagradost.cloudstream3.ui.result.ActorFilmographyRepositoryTest' \
            --tests 'com.lagradost.cloudstream3.ui.discover.*' \
            :app:lintPrereleaseDebug :app:assemblePrereleaseDebug :app:assembleStableRelease
      - name: Verify stable signing certificate
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/stable/release/*.apk | tee "$RUNNER_TEMP/stable-cert.txt"
          grep -qi 'b4a192d86f664d1288e1023964fedadb2fd34ff5239696e8bcd3e16f8acdf69f' "$RUNNER_TEMP/stable-cert.txt"
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cloudstream-discover-apk
          path: app/build/outputs/apk/prerelease/debug/*.apk
      - name: Upload stable APK (most performant, alongside beta)
        uses: actions/upload-artifact@v7
        with:
          name: cloudstream-stable-apk
          path: app/build/outputs/apk/stable/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discovery-test-reports
          path: |
            app/build/reports/tests/testPrereleaseDebugUnitTest/
            app/build/test-results/testPrereleaseDebugUnitTest/
            app/build/reports/lint-results-prereleaseDebug.*
          if-no-files-found: ignore
          retention-days: 14
